# 放到 /etc/nginx/sites-available/seat，然后：
#   sudo ln -s /etc/nginx/sites-available/seat /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 没有域名就把 server_name 改成 _

server {
    listen 80;
    server_name seat.example.edu.cn;   # ← 换成你的域名；没有域名写 _

    client_max_body_size 20m;          # 地图照片上传，必须开大

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 地图照片可缓存，减轻服务器压力
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}
